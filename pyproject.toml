[project]
name = "aif-tutorial"
version = "0.0.0"
description = "An interactive tutorial on active inference"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7"]
# build.py renders the Markdown modules to HTML. Build-time only; nothing here
# ships to the browser.
build = ["markdown>=3.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aif", "worlds", "rendering"]
